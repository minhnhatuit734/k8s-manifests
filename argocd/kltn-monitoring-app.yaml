apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kltn-monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/minhnhatuit734/k8s-manifests.git
    targetRevision: main
    path: monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
