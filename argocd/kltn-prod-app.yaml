apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kltn-prod
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/minhnhatuit734/k8s-manifests.git
    targetRevision: main
    path: overlays/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: prod

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  ignoreDifferences:
  - group: apps
    kind: Deployment
    jsonPointers:
    - /spec/replicas
