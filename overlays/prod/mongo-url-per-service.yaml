apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-service
spec:
  template:
    spec:
      containers:
        - name: users-service
          env:
            - name: MONGO_URL
              valueFrom:
                secretKeyRef:
                  name: kltn-app-secrets
                  key: MONGO_URL_USERS

